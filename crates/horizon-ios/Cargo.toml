[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The game as a static library for the iOS app (ios/App): one C entry point"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
horizon-client = { path = "../horizon-client" }
horizon-threads = { path = "../horizon-threads" }
# Resources without Java (facts.rs): assemble on the device.
horizon-prepare = { path = "../horizon-prepare" }
horizon-mods = { path = "../horizon-mods", default-features = false, features = ["index"] }

[lints]
workspace = true
