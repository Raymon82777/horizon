[package]
name = "horizon-facts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Resources without Java: pack Horizon's computed tables once, assemble the resources on the player's device"

[dependencies]
# Only for pyjson (Python-compatible JSON, so manifests match horizon-prepare's output).
horizon-prepare = { path = "../../../crates/horizon-prepare" }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[[bin]]
name = "horizon-facts"
path = "src/main.rs"

[lints]
workspace = true
