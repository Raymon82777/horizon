name: HorizonStub
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  HorizonStub:
    type: application
    platform: iOS
    sources: [Stub]
    settings:
      # From ios/signing.env: generate with `. ios/signing.sh` exported (here=ios).
      PRODUCT_BUNDLE_IDENTIFIER: ${HORIZON_IOS_BUNDLE_ID}
      DEVELOPMENT_TEAM: ${HORIZON_IOS_TEAM}
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: ${HORIZON_IOS_ENTITLEMENTS}
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
