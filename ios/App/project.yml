name: Horizon
options:
  bundleIdPrefix: com.raymcdonald
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: BFH3MLCK9L
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Horizon:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    preBuildScripts:
      - name: Build the game (Rust, horizon-ios)
        script: |
          "$SRCROOT/build-rust.sh" "$CONFIGURATION"
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Bundle the facts pack
        script: |
          # The Java-derived tables (horizon-facts pack-facts on a computer). Private: built
          # locally into .mc/facts, never committed or published.
          pack="$SRCROOT/../../.mc/facts/horizon-facts-26.3.zip"
          if [ -f "$pack" ]; then
            cp "$pack" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          else
            echo "warning: no $pack: the app can't build resources"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raymcdonald.horizon
        PRODUCT_NAME: Horizon
        CODE_SIGN_ENTITLEMENTS: ../Horizon.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Horizon-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/aarch64-apple-ios/release
        # iOS gives the main thread 1 MiB; the game runs on it (winit) and needs more.
        OTHER_LDFLAGS: -lhorizon_ios -Wl,-stack_size,0x4000000
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Horizon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: AuthenticationServices.framework
